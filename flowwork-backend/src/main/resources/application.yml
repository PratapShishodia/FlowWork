spring:
  application:
    name: flowwork-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/FlowWorkDB}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
#
#  flyway:
#    enabled: true
#    locations: classpath:db/migration

server:
  port: ${APPLICATION_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  AccessTokenExpiration: ${ACCESS_TOKEN_EXPIRATION_TIME}
  refreshTokenExpiration: ${REFRESH_TOKEN_EXPIRATION_TIME}
  secret: ${SECRET_KEY}